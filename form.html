 <html lang="en">
 <head>

    <title>HTML Inputs</title>
 </head>
 <body>

        <label for="">Specify Range</label>
        <input type="range" name="" id=""><br>

        <input type="file" name="" id="">
    </form>
 </body>
 </html>
